name: ai-clip-factory

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: clipfactory
      POSTGRES_USER: clipfactory
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clipfactory -d clipfactory"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://clipfactory:${POSTGRES_PASSWORD}@db:5432/clipfactory
      MEDIA_ROOT: /data/media
      FREE_MODE: ${FREE_MODE:-true}
      FRONTEND_URL: ${PUBLIC_URL:-http://localhost:3000}
      API_BASE_URL: ${PUBLIC_URL:-http://localhost:3000}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media_data:/data/media

  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://clipfactory:${POSTGRES_PASSWORD}@db:5432/clipfactory
      MEDIA_ROOT: /data/media
      FREE_MODE: ${FREE_MODE:-true}
      FRONTEND_URL: ${PUBLIC_URL:-http://localhost:3000}
      API_BASE_URL: ${PUBLIC_URL:-http://localhost:3000}
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "*"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - media_data:/data/media
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3

  worker:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://clipfactory:${POSTGRES_PASSWORD}@db:5432/clipfactory
      MEDIA_ROOT: /data/media
      FREE_MODE: ${FREE_MODE:-true}
      FRONTEND_URL: ${PUBLIC_URL:-http://localhost:3000}
      API_BASE_URL: ${PUBLIC_URL:-http://localhost:3000}
    command: ["python", "-m", "app.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - media_data:/data/media
    stop_grace_period: 60s

  web:
    build: ./frontend
    restart: unless-stopped
    environment:
      API_ORIGIN: http://api:8000
      NODE_ENV: production
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  media_data:
