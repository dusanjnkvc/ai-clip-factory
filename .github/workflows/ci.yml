name: Validate AI Clip Factory

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      APP_SECRET: ci-test-secret-at-least-thirty-two-characters
      DATABASE_URL: sqlite:///./data/ci.db
      MEDIA_ROOT: ./data/media
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Install Python packages
        run: python -m pip install -r backend/requirements.txt
      - name: Apply database migrations
        working-directory: backend
        run: alembic upgrade head
      - name: Run backend tests including real media rendering
        working-directory: backend
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci
      - name: Type check and build
        working-directory: frontend
        run: npm run build

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose --env-file .env.example config --quiet
      - name: Build backend image
        run: docker build --tag ai-clip-factory-api:ci ./backend
      - name: Build frontend image
        run: docker build --tag ai-clip-factory-web:ci ./frontend
